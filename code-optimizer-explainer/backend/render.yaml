services:
  - type: web
    name: opticode-backend
    runtime: python
    region: oregon
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: true
      - key: SUPABASE_URL
        fromDatabase:
          name: opticode-db
          property: supabase_url
      - key: SUPABASE_KEY
        fromDatabase:
          name: opticode-db
          property: supabase_key
      - key: GEMINI_API_KEY
        scope: run
      - key: OPENROUTER_API_KEY
        scope: run
