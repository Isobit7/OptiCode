services:
  - type: web
    name: opticode-backend
    runtime: python
    region: oregon
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: 1
      - key: SUPABASE_URL
        scope: run
      - key: SUPABASE_KEY
        scope: run
      - key: GEMINI_API_KEY
        scope: run
      - key: OPENROUTER_API_KEY
        scope: run
      - key: CORS_ORIGINS
        value: "https://opticode.vercel.app,https://opticode-*.vercel.app"
      - key: CSRF_SECRET_KEY
        scope: run
