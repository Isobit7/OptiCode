name: "OptiCode CI Review & Security Audit"
description: "Run automated security scans, explanations, and code reviews on pull requests."
inputs:
  api-key:
    description: "OptiCode API Key (generate from OptiCode Settings UI)"
    required: true
  analysis-types:
    description: "Comma-separated analysis types: security, explain, pr-review"
    required: false
    default: "security,explain"
  fail-on-severity:
