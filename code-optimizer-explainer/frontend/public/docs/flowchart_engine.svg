<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1017"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0b0d13"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" stroke="#272f45" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect width="800" height="40" rx="16" fill="#161b26"/>
  <rect y="25" width="800" height="15" fill="#161b26"/>
  
  <!-- Window Controls -->
  <circle cx="24" cy="20" r="6" fill="#ef4444"/>
  <circle cx="44" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="20" r="6" fill="#10b981"/>

  <text x="92" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14">Interactive Mermaid Flowchart Engine — OptiCode</text>

  <!-- Canvas Container -->
  <rect x="20" y="56" width="760" height="374" rx="12" fill="#121622" stroke="#232a3d" stroke-width="1"/>

  <!-- Diagram Flow Lines -->
  <!-- Start -> Validation -->
  <path d="M 170 225 L 260 225" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Validation -> AI Pipeline (Yes) -->
  <path d="M 390 225 L 480 225" stroke="#10b981" stroke-width="3" fill="none"/>
  
  <!-- Validation -> Error Handler (No) -->
  <path d="M 325 260 L 325 340 L 480 340" stroke="#ef4444" stroke-dasharray="6,6" stroke-width="2" fill="none"/>

  <!-- AI Pipeline -> Result Cache -->
  <path d="M 610 225 L 700 225" stroke="#38bdf8" stroke-width="3" fill="none"/>

  <!-- Node 1: Start -->
  <rect x="50" y="195" width="120" height="60" rx="30" fill="url(#orangeGrad)" stroke="#ffffff" stroke-width="1.5"/>
  <text x="110" y="230" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12" text-anchor="middle">1. User Code Input</text>

  <!-- Node 2: Decision Diamond -->
  <polygon points="325,175 400,225 325,275 250,225" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="325" y="222" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Valid Syntax?</text>
  <text x="325" y="236" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">(Deterministic Check)</text>

  <text x="430" y="215" fill="#34d399" font-family="monospace" font-weight="bold" font-size="11">YES</text>
  <text x="340" y="300" fill="#f87171" font-family="monospace" font-weight="bold" font-size="11">NO</text>

  <!-- Node 3: AI Pipeline -->
  <rect x="480" y="195" width="130" height="60" rx="10" fill="#065f46" stroke="#10b981" stroke-width="2"/>
  <text x="545" y="222" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">2. AI Optimization</text>
  <text x="545" y="238" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Llama 3.3 / Gemini</text>

  <!-- Node 4: Error Handler -->
  <rect x="480" y="310" width="130" height="60" rx="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="545" y="337" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Syntax Error Alert</text>
  <text x="545" y="353" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Return Line Number</text>

  <!-- Node 5: Result -->
  <rect x="670" y="195" width="90" height="60" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
  <text x="715" y="222" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">3. Diff View</text>
  <text x="715" y="238" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Display Output</text>
</svg>
