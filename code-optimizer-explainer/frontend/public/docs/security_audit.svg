<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1017"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0b0d13"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" stroke="#272f45" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect width="800" height="40" rx="16" fill="#161b26"/>
  <rect y="25" width="800" height="15" fill="#161b26"/>
  
  <!-- Window Controls -->
  <circle cx="24" cy="20" r="6" fill="#ef4444"/>
  <circle cx="44" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="20" r="6" fill="#10b981"/>

  <text x="92" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14">Security and Secret Audit Scanner — OptiCode</text>

  <!-- Score Card Top Row -->
  <rect x="20" y="56" width="240" height="90" rx="12" fill="#181e2b" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="36" y="80" fill="#f87171" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Vulnerabilities Found</text>
  <text x="36" y="125" fill="#ef4444" font-family="system-ui, sans-serif" font-weight="900" font-size="32">2 Critical</text>

  <rect x="280" y="56" width="240" height="90" rx="12" fill="#181e2b" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="296" y="80" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Secret Leak Status</text>
  <text x="296" y="125" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="900" font-size="32">API Key Exposed</text>

  <rect x="540" y="56" width="240" height="90" rx="12" fill="#181e2b" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="556" y="80" fill="#34d399" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Security Rating</text>
  <text x="556" y="125" fill="#10b981" font-family="system-ui, sans-serif" font-weight="900" font-size="32">B+ (Fixable)</text>

  <!-- Detailed Audit Items -->
  <rect x="20" y="162" width="760" height="268" rx="12" fill="#121622" stroke="#232a3d" stroke-width="1"/>
  <text x="36" y="190" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Detailed Risk Breakdown and Remediations</text>

  <!-- Audit Item 1 -->
  <rect x="36" y="206" width="728" height="60" rx="8" fill="#1c161a" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="48" y="218" width="80" height="20" rx="4" fill="#ef4444"/>
  <text x="88" y="232" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="10" text-anchor="middle">HIGH RISK</text>
  <text x="140" y="232" fill="#f87171" font-family="system-ui, sans-serif" font-weight="700" font-size="12">SQL Injection Vulnerability</text>
  <text x="140" y="252" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Raw query string interpolation detected. Use parameterized queries SELECT * FROM users WHERE id = %s.</text>

  <!-- Audit Item 2 -->
  <rect x="36" y="278" width="728" height="60" rx="8" fill="#1c1a16" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="48" y="290" width="90" height="20" rx="4" fill="#f59e0b"/>
  <text x="93" y="304" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="10" text-anchor="middle">SECRET LEAK</text>
  <text x="150" y="304" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Hardcoded OpenAI API Key (sk-proj-...)</text>
  <text x="150" y="324" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Replace inline secret with os.getenv("OPENAI_API_KEY") and add .env to .gitignore.</text>

  <!-- Audit Item 3 -->
  <rect x="36" y="350" width="728" height="60" rx="8" fill="#131d1a" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="48" y="362" width="70" height="20" rx="4" fill="#10b981"/>
  <text x="83" y="376" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="10" text-anchor="middle">PASSED</text>
  <text x="130" y="376" fill="#34d399" font-family="system-ui, sans-serif" font-weight="700" font-size="12">CORS and XSS Input Sanitization</text>
  <text x="130" y="396" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Headers and output escaping compliant with OWASP Top 10 guidelines.</text>
</svg>
