<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1017"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0b0d13"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2330" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#121620" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" stroke="#272f45" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect width="800" height="40" rx="16" fill="#161b26"/>
  <rect y="25" width="800" height="15" fill="#161b26"/>
  
  <!-- Window Controls -->
  <circle cx="24" cy="20" r="6" fill="#ef4444"/>
  <circle cx="44" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="20" r="6" fill="#10b981"/>

  <!-- Header Title -->
  <text x="92" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14">OptiCode Workspace</text>
  <rect x="240" y="11" width="70" height="18" rx="9" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="1"/>
  <text x="275" y="23" fill="#f97316" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">AI ACTIVE</text>

  <!-- Action Bar Pills -->
  <rect x="20" y="54" width="760" height="42" rx="10" fill="#181d2a" stroke="#2a3449" stroke-width="1"/>
  
  <rect x="30" y="61" width="90" height="28" rx="6" fill="url(#orangeGrad)"/>
  <text x="75" y="79" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Explain</text>

  <rect x="128" y="61" width="95" height="28" rx="6" fill="#22293a" stroke="#333f57" stroke-width="1"/>
  <text x="175" y="79" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Humanize</text>

  <rect x="231" y="61" width="85" height="28" rx="6" fill="#22293a" stroke="#333f57" stroke-width="1"/>
  <text x="273" y="79" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Prettify</text>

  <rect x="324" y="61" width="105" height="28" rx="6" fill="#22293a" stroke="#333f57" stroke-width="1"/>
  <text x="376" y="79" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Security Audit</text>

  <rect x="437" y="61" width="95" height="28" rx="6" fill="#22293a" stroke="#333f57" stroke-width="1"/>
  <text x="484" y="79" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Translate</text>

  <!-- Left Code Input Panel -->
  <rect x="20" y="108" width="370" height="320" rx="12" fill="url(#cardGrad)" stroke="#273045" stroke-width="1.5"/>
  <text x="36" y="132" fill="#64748b" font-family="monospace" font-size="11">Input Snippet (Python)</text>

  <!-- Code text -->
  <text x="36" y="160" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">def</text>
  <text x="65" y="160" fill="#60a5fa" font-family="Consolas, monospace" font-size="12">process_user_data</text>
  <text x="195" y="160" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">(items):</text>

  <text x="56" y="182" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">result = []</text>
  <text x="56" y="204" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">for</text>
  <text x="82" y="204" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">i</text>
  <text x="93" y="204" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">in</text>
  <text x="112" y="204" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">range(len(items)):</text>
  
  <text x="76" y="226" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">if</text>
  <text x="93" y="226" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">items[i] != None:</text>

  <text x="96" y="248" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">result.append(items[i] * 2)</text>

  <text x="56" y="270" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">return</text>
  <text x="105" y="270" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">result</text>

  <!-- Right AI Output Explanation Panel -->
  <rect x="410" y="108" width="370" height="320" rx="12" fill="url(#cardGrad)" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="410" y="108" width="370" height="36" rx="12" fill="#1d2333"/>
  <text x="426" y="131" fill="#f97316" font-family="system-ui, sans-serif" font-weight="700" font-size="12">OptiCode Explanation and Breakdown</text>

  <rect x="426" y="156" width="338" height="60" rx="8" fill="#161b27" stroke="#252e42" stroke-width="1"/>
  <text x="438" y="176" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Summary:</text>
  <text x="438" y="196" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Iterates over elements, filters out nulls, and doubles values.</text>

  <text x="426" y="238" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Optimization Recommendation:</text>
  <text x="426" y="258" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Refactor to list comprehension for O(N) single-pass speed.</text>

  <rect x="426" y="276" width="338" height="134" rx="8" fill="#0f131d" stroke="#1d2538" stroke-width="1"/>
  <text x="438" y="296" fill="#64748b" font-family="monospace" font-size="10"># Refactored Code (Pythonic)</text>
  <text x="438" y="320" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">def</text>
  <text x="466" y="320" fill="#34d399" font-family="Consolas, monospace" font-size="12">process_user_data</text>
  <text x="595" y="320" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">(items):</text>
  <text x="456" y="344" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">return</text>
  <text x="505" y="344" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">[x * 2</text>
  <text x="555" y="344" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">for</text>
  <text x="580" y="344" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">x</text>
  <text x="593" y="344" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">in</text>
  <text x="612" y="344" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">items</text>
  <text x="652" y="344" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">if</text>
  <text x="668" y="344" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">x is not None]</text>
</svg>
