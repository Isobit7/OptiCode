<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1017"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0b0d13"/>
    </linearGradient>
    <linearGradient id="diffRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="diffGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" stroke="#272f45" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect width="800" height="40" rx="16" fill="#161b26"/>
  <rect y="25" width="800" height="15" fill="#161b26"/>
  
  <!-- Window Controls -->
  <circle cx="24" cy="20" r="6" fill="#ef4444"/>
  <circle cx="44" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="20" r="6" fill="#10b981"/>

  <text x="92" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14">Side-by-Side Diff View — OptiCode</text>

  <!-- Split View Headers -->
  <rect x="20" y="52" width="370" height="34" rx="8" fill="#1b202e" stroke="#2a3349" stroke-width="1"/>
  <text x="36" y="74" fill="#f87171" font-family="system-ui, sans-serif" font-weight="700" font-size="12">🔴 Original Code (Before)</text>

  <rect x="410" y="52" width="370" height="34" rx="8" fill="#1b202e" stroke="#2a3349" stroke-width="1"/>
  <text x="426" y="74" fill="#34d399" font-family="system-ui, sans-serif" font-weight="700" font-size="12">🟢 Optimized Refactor (After)</text>

  <!-- Left Code Container -->
  <rect x="20" y="96" width="370" height="334" rx="10" fill="#121622" stroke="#232a3d" stroke-width="1"/>
  
  <!-- Lines Left -->
  <text x="34" y="125" fill="#475569" font-family="monospace" font-size="11">1</text>
  <text x="60" y="125" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">async function</text>
  <text x="160" y="125" fill="#60a5fa" font-family="Consolas, monospace" font-size="12">fetchUsers</text>
  <text x="235" y="125" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">() {</text>

  <text x="34" y="152" fill="#475569" font-family="monospace" font-size="11">2</text>
  <text x="60" y="152" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">let</text>
  <text x="88" y="152" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">res = await fetch('/api/data')</text>

  <!-- Deleted Line Highlight -->
  <rect x="22" y="165" width="366" height="30" fill="url(#diffRed)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1"/>
  <text x="34" y="185" fill="#ef4444" font-family="monospace" font-weight="bold" font-size="11">- 3</text>
  <text x="60" y="185" fill="#f87171" font-family="Consolas, monospace" font-size="12">let data = await res.json()</text>

  <text x="34" y="218" fill="#475569" font-family="monospace" font-size="11">4</text>
  <text x="60" y="218" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">let</text>
  <text x="88" y="218" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">out = []</text>

  <rect x="22" y="231" width="366" height="30" fill="url(#diffRed)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1"/>
  <text x="34" y="251" fill="#ef4444" font-family="monospace" font-weight="bold" font-size="11">- 5</text>
  <text x="60" y="251" fill="#f87171" font-family="Consolas, monospace" font-size="12">for(var i=0; i&lt;data.length; i++) {</text>

  <text x="34" y="284" fill="#475569" font-family="monospace" font-size="11">6</text>
  <text x="80" y="284" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">out.push(data[i].name)</text>
  
  <text x="34" y="317" fill="#475569" font-family="monospace" font-size="11">7</text>
  <text x="60" y="317" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">}</text>

  <text x="34" y="350" fill="#475569" font-family="monospace" font-size="11">8</text>
  <text x="60" y="350" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">return</text>
  <text x="110" y="350" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">out;</text>

  <!-- Right Code Container -->
  <rect x="410" y="96" width="370" height="334" rx="10" fill="#121622" stroke="#232a3d" stroke-width="1"/>

  <!-- Lines Right -->
  <text x="424" y="125" fill="#475569" font-family="monospace" font-size="11">1</text>
  <text x="450" y="125" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">export async function</text>
  <text x="605" y="125" fill="#34d399" font-family="Consolas, monospace" font-size="12">fetchUsers</text>
  <text x="680" y="125" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">() {</text>

  <rect x="412" y="138" width="366" height="30" fill="url(#diffGreen)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <text x="424" y="158" fill="#10b981" font-family="monospace" font-weight="bold" font-size="11">+ 2</text>
  <text x="450" y="158" fill="#34d399" font-family="Consolas, monospace" font-size="12">const res = await fetch('/api/data');</text>

  <rect x="412" y="171" width="366" height="30" fill="url(#diffGreen)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <text x="424" y="191" fill="#10b981" font-family="monospace" font-weight="bold" font-size="11">+ 3</text>
  <text x="450" y="191" fill="#34d399" font-family="Consolas, monospace" font-size="12">if (!res.ok) throw new Error('Fetch failed');</text>

  <text x="424" y="224" fill="#475569" font-family="monospace" font-size="11">4</text>
  <text x="450" y="224" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">const</text>
  <text x="495" y="224" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">data = await res.json();</text>

  <rect x="412" y="237" width="366" height="30" fill="url(#diffGreen)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <text x="424" y="257" fill="#10b981" font-family="monospace" font-weight="bold" font-size="11">+ 5</text>
  <text x="450" y="257" fill="#34d399" font-family="Consolas, monospace" font-size="12">return data.map(user => user.name);</text>

  <text x="424" y="290" fill="#475569" font-family="monospace" font-size="11">6</text>
  <text x="450" y="290" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">}</text>
</svg>
